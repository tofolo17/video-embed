repos:
  - repo: local
    hooks:
      - id: requirements
        name: requirements
        entry: bash -c "venv/Scripts/pip3.exe freeze > requirements.txt ; git add requirements.txt"
        language: system
        pass_filenames: false
        stages: [commit]
  - repo: local
    hooks:
      - id: clean
        name: clean
        entry: bash -c "venv/Scripts/autopep8.exe --recursive --in-place --exclude venv . ; git add ."
        language: system
        pass_filenames: false
        stages: [commit]
